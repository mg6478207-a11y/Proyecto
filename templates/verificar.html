<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificar código</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); width: 100%; max-width: 400px; }
  </style>
</head>
<body>
  <div class="card">
    <h4 class="text-center mb-3">Verificar código</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label for="codigo" class="form-label">Código de verificación</label>
        <input type="text" class="form-control" name="codigo" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Verificar</button>
    </form>
  </div>
</body>
</html>
