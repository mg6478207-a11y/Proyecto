<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificar código</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
     body {
      background: linear-gradient(135deg, #f9e4c8, #f6d6ad, #ffd8a8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
    }
    h4 {
      text-align: center;
      font-weight: 700;
      color: #4b2e05;
      margin-bottom: 25px;
    }

    h4::before {
      content: "🦊 ";
    }
    button {
      background: linear-gradient(90deg, #ff9933, #f77f00);
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 17px;
      font-weight: 600;
      padding: 12px;
      margin-top: 10px;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #f77f00, #d65a00);
      box-shadow: 0 6px 15px rgba(247, 127, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h4 class="text-center mb-3">Verificar código</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label for="codigo" class="form-label">Código de verificación</label>
        <input type="text" class="form-control" name="codigo" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Verificar</button>
    </form>
  </div>
   <!-- ── Smartsupp Live Chat ── -->
<script type="text/javascript">
  var _smartsupp = _smartsupp || {};
  _smartsupp.key = 'dc68ffdd55d786d000505c6677df5ce9aa57e49d';
  _smartsupp.language = 'es';

  {% if session.get('nombre') %}
  _smartsupp.name  = '{{ session["nombre"] }}';
  _smartsupp.variables = {
    curso: { label: 'Curso', value: '{{ session.get("curso", "Sin asignar") }}' },
    plan:  { label: 'Plan',  value: '{{ session.get("plan",  "gratuito") }}' }
  };
  {% endif %}

  window.smartsupp||(function(d) {
    var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
    s=d.getElementsByTagName('script')[0];
    c=d.createElement('script');
    c.type='text/javascript';c.charset='utf-8';c.async=true;
    c.src='https://www.smartsuppchat.com/loader.js?';
    s.parentNode.insertBefore(c,s);
  })(document);
</script>
<!-- ── Fin Smartsupp ── -->
</body>
</html>
