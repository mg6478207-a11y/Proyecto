<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RETOMATE - Grado 4 | Unidad 4</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      background: linear-gradient(135deg, #2c1d11 0%, #3e2723 100%);
      min-height: 100vh;
      margin: 0;
      color: white;
    }
    main { max-width:1200px; margin:10px auto; padding:10px; }
    
    /* HEADER UNIFICADO */
    header {
        background: linear-gradient(135deg, #2c1810 0%, #5d4037 100%);
        padding: 15px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        flex-wrap: wrap;
    }
    header img { height: 70px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    header h1 { color: #ff9a56; font-size: 2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-left: 15px; }
    nav ul { list-style: none; display: flex; gap: 20px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; padding: 10px 20px; border-radius: 20px; transition: all 0.3s; font-weight: bold; background: rgba(255, 255, 255, 0.1); }
    nav a:hover { background: #ff9a56; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    /* CONTENEDOR JUEGO Y FOOTER */
    .game-container { display:inline-block; position:relative; }
    canvas { 
        image-rendering: pixelated; 
        border: 4px solid #ff9100; 
        border-radius: 15px 15px 0 0; 
        background: #1c140d; 
        box-shadow: 0 0 40px rgba(255, 145, 0, 0.4);
        display: block;
    }
    .controls-footer {
        background: #112240;
        border: 4px solid #ff9100;
        border-top: none;
        border-radius: 0 0 15px 15px;
        padding: 15px 25px;
        color: #ff9100;
        font-family: 'Minecraftia', monospace;
        font-size: 14px;
        text-align: center;
        max-width: 950px;
    }
    #usuario { text-align:center; font-family:'Minecraftia'; margin-bottom:10px; color:#ff9a56; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center;">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo RETOMATE">
        <h1>RETOMATE</h1>
    </div>
    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">🏠 Inicio</a></li>
            <li><a href="{{ url_for('tematicas') }}">📚 Temáticas</a></li>
            <li><a href="{{ url_for('videos') }}">🎥 Videos</a></li>
            <li><a href="{{ url_for('progreso') }}">📊 Progreso</a></li>
            <li><a href="{{ url_for('login') }}">🔐 Iniciar Sesión</a></li>
            <li><a href="{{ url_for('logout') }}">🚪 Cerrar Sesión</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <h2>📘 Unidad 4: (Nombre de la Unidad)</h2>
    <div id="usuario">Bienvenido, <strong>{{ session['nombre'] }}</strong> 👋</div>

    <center>
        <div class="game-container">
          <canvas id="gameCanvas" width="1000" height="600"></canvas>
          <div class="controls-footer">
            ⌨️ Controles: [Insertar instrucciones aquí, ej: Usa las flechas para moverte]
          </div>
        </div>
    </center>

    <input type="hidden" id="usuario_id" value="{{ session['id'] }}">
  </main>

  <script src="{{ url_for('static', filename='js/Grado4_modulo4.js') }}"></script>
</body>
</html>
