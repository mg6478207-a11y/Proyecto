<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RETÓMATE - Información del Estudiante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:linear-gradient(135deg,#f9e4c8,#f6d6ad,#ffd8a8); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; }
    .card { width:100%; max-width:700px; background:#fff9f3; border:none; border-radius:25px; box-shadow:0 10px 25px rgba(0,0,0,0.1); padding:35px 45px; animation:fadeIn 0.8s ease-in-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    h4 { text-align:center; font-weight:700; color:#4b2e05; margin-bottom:25px; }
    h4::before { content:"🦊 "; }
    label { font-weight:500; color:#4b2e05; }
    .form-control,.form-select { border-radius:12px; border:1px solid #e0b98f; background:#fffdf9; transition:all 0.2s; }
    .form-control:focus,.form-select:focus { border-color:#ff9933; box-shadow:0 0 0 0.2rem rgba(255,153,51,0.25); }
    button { background:linear-gradient(90deg,#ff9933,#f77f00); border:none; border-radius:15px; color:white; font-size:17px; font-weight:600; padding:12px; margin-top:10px; transition:all 0.3s; }
    button:hover { transform:translateY(-2px); background:linear-gradient(90deg,#f77f00,#d65a00); box-shadow:0 6px 15px rgba(247,127,0,0.3); }
    .curso-badge { display:inline-block; background:#ff9933; color:white; border-radius:20px; padding:4px 14px; font-size:0.85em; margin:2px; cursor:pointer; transition:all 0.2s; border:2px solid transparent; }
    .curso-badge:hover,.curso-badge.selected { background:#d65a00; border-color:#fff; transform:scale(1.05); }
    #curso-seleccionado { font-weight:bold; color:#4b2e05; font-size:1.05em; }
  </style>
</head>
<body>
<div class="card">
  <h4>Información del Estudiante</h4>
  <form method="POST">
 
    <!-- ══ NUEVO: Selección de curso al que pasa ══ -->
    <div class="mb-4 p-3" style="background:#fff3e0;border-radius:16px;border:2px solid #ff9933;">
      <label class="mb-2" style="font-size:1.05em;">📚 ¿A qué curso vas a pasar?</label>
      <div id="cursos-container" class="mb-2">
        {% for c in cursos %}
          <span class="curso-badge" onclick="seleccionarCurso(this, '{{ c }}')">{{ c }}</span>
        {% endfor %}
      </div>
      <div>Curso seleccionado: <span id="curso-seleccionado">Ninguno</span></div>
      <input type="hidden" name="curso" id="curso-hidden" required>
    </div>
 
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Edad</label>
        <input type="number" name="edad" class="form-control" required>
      </div>
      <div class="col-md-8 mb-3">
        <label>Género</label>
        <select name="genero" class="form-select" required>
          <option value="">Selecciona...</option>
          <option>Femenino</option><option>Masculino</option><option>Otro</option>
        </select>
      </div>
    </div>
 
    <div class="mb-3">
      <label>¿Vive con sus padres?</label>
      <select name="vive_con_padres" class="form-select" required>
        <option value="t">Sí</option><option value="f">No</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Estrato socioeconómico</label>
      <input type="number" name="estrato" min="1" max="6" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>¿Trabaja actualmente?</label>
      <select name="trabaja" class="form-select" required>
        <option value="f">No</option><option value="t">Sí</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Horas de estudio al día</label>
      <input type="number" step="0.1" name="horas_estudio_dia" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Promedio anterior</label>
      <input type="number" name="promedio_anterior" min="0" max="100" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Nivel educativo de los padres</label>
      <select name="nivel_educativo_padres" class="form-select" required>
        <option value="">Selecciona...</option>
        <option>Primaria</option><option>Secundaria</option>
        <option>Bachiller</option><option>Universitario</option>
      </select>
    </div>
    <div class="mb-3">
      <label>¿Tiene acceso a internet?</label>
      <select name="acceso_internet" class="form-select" required>
        <option value="t">Sí</option><option value="f">No</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Dispositivo principal de estudio</label>
      <select name="dispositivo_estudio" class="form-select" required>
        <option>Celular</option><option>Tablet</option>
        <option>Portátil</option><option>Computador de escritorio</option>
        <option>Ninguno</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Distancia al colegio (km)</label>
      <input type="number" step="0.1" name="distancia_colegio" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Nivel de motivación (1-5)</label>
      <input type="number" name="motivacion" min="1" max="5" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Nivel de estrés (1-5)</label>
      <input type="number" name="estres" min="1" max="5" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Apoyo familiar (1-5)</label>
      <input type="number" name="apoyo_familiar" min="1" max="5" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Satisfacción con el estudio (1-5)</label>
      <input type="number" name="satisfaccion_estudio" min="1" max="5" class="form-control" required>
    </div>
 
    <button type="submit" class="w-100">Guardar información 🦊</button>
  </form>
</div>
 
<script>
function seleccionarCurso(el, nombre) {
  document.querySelectorAll('.curso-badge').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('curso-seleccionado').textContent = nombre;
  document.getElementById('curso-hidden').value = nombre;
}
</script>

</html>
