<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RETOMATE - Grado 2 Módulo 2: Restas con Presta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  <style>
    body { font-family:'Comic Sans MS',Arial,sans-serif; background:linear-gradient(135deg,#0c4a6e,#164e63,#0c4a6e); min-height:100vh; overflow-x:hidden; }
    main { max-width:1200px; margin:10px auto; padding:10px; }
    #gameWrapper { display:flex; justify-content:center; }
    canvas { image-rendering:pixelated; border:4px solid #0ea5e9; border-radius:8px; touch-action:none; box-shadow:0 0 30px rgba(14,165,233,0.4); }
    header { background:linear-gradient(135deg,#0c4a6e,#0369a1); padding:15px 30px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 20px rgba(0,0,0,0.4); flex-wrap:wrap; }
    header img { height:70px; border-radius:10px; }
    header h1 { color:#7dd3fc; font-size:2em; text-shadow:0 0 20px rgba(125,211,252,0.5); margin-left:15px; }
    nav ul { list-style:none; display:flex; gap:20px; flex-wrap:wrap; }
    nav a { color:white; text-decoration:none; padding:10px 20px; border-radius:20px; transition:all 0.3s; font-weight:bold; background:rgba(255,255,255,0.1); }
    nav a:hover { background:#0ea5e9; transform:translateY(-2px); }
    #hudMsg { text-align:center; font-family:'Minecraftia',monospace; margin-top:8px; color:#7dd3fc; font-size:12px; }
    #usuario { text-align:center; font-family:'Minecraftia'; margin-bottom:10px; color:#7dd3fc; }
    #touchControls { display:none; justify-content:center; gap:16px; margin-top:12px; flex-wrap:wrap; }
    .touchBtn { width:70px; height:70px; border-radius:50%; background:rgba(14,165,233,0.85); color:white; font-size:24px; border:3px solid rgba(255,255,255,0.6); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; box-shadow:0 4px 15px rgba(14,165,233,0.4); }
    @media(max-width:768px){ #touchControls{display:flex;} canvas{width:100%!important;height:auto!important;} }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;">
      <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo RETOMATE">
      <h1>RETOMATE</h1>
    </div>
    <nav><ul>
      <li><a href="{{ url_for('home') }}">🏠 Inicio</a></li>
      <li><a href="{{ url_for('tematicas') }}">📚 Temáticas</a></li>
      <li><a href="{{ url_for('videos') }}">🎥 Videos</a></li>
      <li><a href="{{ url_for('progreso') }}">📊 Progreso</a></li>
      <li><a href="{{ url_for('logout') }}">🚪 Cerrar Sesión</a></li>
    </ul></nav>
  </header>
  <main>
    <h2 style="color:#7dd3fc;text-shadow:0 0 10px rgba(125,211,252,0.4)">🚢 Grado 2 - Módulo 2: ¡Restas con Presta!</h2>
    <div id="usuario">¡Hola, <strong>{{ session['nombre'] }}</strong>! 🦊 Hunde el submarino con la respuesta correcta</div>
    <div id="gameWrapper">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <div id="touchControls">
      <div class="touchBtn" id="btnU">▲</div>
      <div class="touchBtn" id="btnFire" style="background:rgba(239,68,68,0.85);">💥</div>
      <div class="touchBtn" id="btnD">▼</div>
    </div>
    <p id="hudMsg">💻 ↑ ↓ para apuntar · Espacio para disparar &nbsp;|&nbsp; 📱 ▲ ▼ y 💥</p>
    <input type="hidden" id="usuario_id" value="{{ session['id'] }}">
  </main>
  <script src="{{ url_for('static', filename='js/sonidos.js') }}"></script>
  <script src="{{ url_for('static', filename='js/Grado2_modulo2.js') }}"></script>
</body>
</html>
